<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; margin: 0; padding: 14px 16px; background: #141414; color: #fff;
    font: 13px/1.6 -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .ver { color: #888; font-size: 11px; margin-bottom: 10px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between;
    background: #1d1d1d; border: 1px solid #2e2e2e; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 10px; cursor: pointer; }
  .switch-row input { width: 18px; height: 18px; accent-color: #3b82f6; cursor: pointer; }
  .btns { display: flex; gap: 8px; }
  .btns button { flex: 1; background: #272727; color: #fff; border: 1px solid #4a4a4a;
    border-radius: 8px; padding: 7px 0; cursor: pointer; font-size: 12px; }
  .btns button:hover { background: #3d3d3d; }
  .hint { color: #777; font-size: 11px; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1>🎬 TubePilot</h1>
  <div class="ver" id="ver"></div>
  <label class="switch-row"><span>전체 사용</span><input type="checkbox" id="enabled"></label>
  <div class="btns">
    <button id="openYt">유튜브 열기</button>
    <button id="openGh">GitHub</button>
  </div>
  <p class="hint">세부 설정(광고 스킵 · SponsorBlock · 줌 · 다시보기)은 유튜브 페이지 우측 하단의 🎬 패널에서 변경할 수 있어요. 전체 사용을 끄면 새로고침 후 적용됩니다.</p>
  <script src="popup.js"></script>
</body>
</html>
