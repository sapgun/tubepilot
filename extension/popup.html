<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="tp-head">
    <img class="tp-logo" src="icons/icon48.png" alt="TubePilot">
    <div class="tp-title">
      <h1>TubePilot</h1>
      <p data-i18n="p_tagline">PC 유튜브 파워팩</p>
    </div>
    <span class="tp-ver" id="ver"></span>
  </header>

  <label class="tp-master">
    <span data-i18n="p_enable_all">전체 사용</span>
    <span class="tp-switch">
      <input type="checkbox" id="enabled">
      <span class="tp-track"><span class="tp-knob"></span></span>
    </span>
  </label>

  <div class="tp-feats">
    <div class="tp-feat"><span class="tp-ico">⏭</span><span data-i18n="p_feat_adskip">광고 자동 스킵</span></div>
    <div class="tp-feat"><span class="tp-ico">🟩</span><span data-i18n="p_feat_sb">SponsorBlock 마킹 · 스킵</span></div>
    <div class="tp-feat"><span class="tp-ico">🔍</span><span data-i18n="p_feat_zoom">영상 줌 · 패닝</span></div>
    <div class="tp-feat"><span class="tp-ico">💬</span><span data-i18n="p_feat_comments">댓글 숨기기</span></div>
    <div class="tp-feat"><span class="tp-ico">📚</span><span data-i18n="p_feat_library">다시보기 라이브러리</span></div>
  </div>

  <div class="tp-lang">
    <label for="langsel">🌐 <span data-i18n="p_language">언어</span></label>
    <select id="langsel">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
    </select>
  </div>

  <div class="tp-lang">
    <label for="shotmodesel">📷 <span data-i18n="set_shot_mode">스크린샷 저장 방식</span></label>
    <select id="shotmodesel">
      <option value="download" data-i18n="shot_mode_download">파일로 다운로드</option>
      <option value="clipboard" data-i18n="shot_mode_clipboard">클립보드에 복사</option>
      <option value="both" data-i18n="shot_mode_both">둘 다</option>
    </select>
  </div>

  <div class="tp-hk">
    <div class="tp-hk-title" data-i18n="hk_title">단축키 설정</div>
    <div class="tp-hk-row">
      <span data-i18n="hk_shot">스크린샷</span>
      <button id="hkShot" class="tp-hk-btn">Alt+S</button>
    </div>
    <div class="tp-hk-row">
      <span data-i18n="hk_comments">댓글 숨기기</span>
      <button id="hkComments" class="tp-hk-btn">Alt+H</button>
    </div>
    <div class="tp-hk-row">
      <span data-i18n="hk_save">다시보기 저장</span>
      <button id="hkSave" class="tp-hk-btn">Alt+B</button>
    </div>
    <div class="tp-hk-row tp-hk-foot">
      <button id="hkReset" class="tp-hk-reset" data-i18n="hk_reset">초기화</button>
    </div>
    <p class="tp-hk-err" id="hkErr"></p>
  </div>

  <div class="tp-btns">
    <button id="openYt" class="tp-primary" data-i18n="p_open_youtube">유튜브 열기</button>
    <button id="openGh" class="tp-ghost">GitHub</button>
  </div>

  <p class="tp-hint" data-i18n="p_hint"></p>

  <div class="tp-dev">
    <div class="tp-dev-title" data-i18n="dev_title">개발자 · 후원</div>
    <div class="tp-dev-links">
      <button id="openX" class="tp-link" title="X">𝕏</button>
      <button id="openMail" class="tp-link" title="Email">✉️</button>
      <button id="openKofi" class="tp-link" title="Ko-fi">☕</button>
    </div>
    <p class="tp-dev-tip" data-i18n="dev_tip"></p>
    <div class="tp-donate">
      <div class="tp-coin"><span class="tp-coin-name">ETH</span><code id="ethAddr"></code></div>
      <div class="tp-coin-btns">
        <button id="copyEth" data-i18n="copy">복사</button>
        <button id="walletEth" data-i18n="open_wallet">지갑으로 보내기</button>
      </div>
    </div>
    <div class="tp-donate">
      <div class="tp-coin"><span class="tp-coin-name">SOL</span><code id="solAddr"></code></div>
      <div class="tp-coin-btns">
        <button id="copySol" data-i18n="copy">복사</button>
        <button id="walletSol" data-i18n="open_wallet">지갑으로 보내기</button>
      </div>
    </div>
  </div>

  <script src="tp-i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
