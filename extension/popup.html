<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="tp-head">
    <img class="tp-logo" src="icons/icon48.png" alt="TubePilot">
    <div class="tp-title">
      <h1>TubePilot</h1>
      <p data-i18n="p_tagline">PC 유튜브 파워팩</p>
    </div>
    <span class="tp-ver" id="ver"></span>
  </header>

  <label class="tp-master">
    <span data-i18n="p_enable_all">전체 사용</span>
    <span class="tp-switch">
      <input type="checkbox" id="enabled">
      <span class="tp-track"><span class="tp-knob"></span></span>
    </span>
  </label>

  <div class="tp-feats">
    <div class="tp-feat"><span class="tp-ico">⏭</span><span data-i18n="p_feat_adskip">광고 자동 스킵</span></div>
    <div class="tp-feat"><span class="tp-ico">🟩</span><span data-i18n="p_feat_sb">SponsorBlock 마킹 · 스킵</span></div>
    <div class="tp-feat"><span class="tp-ico">🔍</span><span data-i18n="p_feat_zoom">영상 줌 · 패닝</span></div>
    <div class="tp-feat"><span class="tp-ico">💬</span><span data-i18n="p_feat_comments">댓글 숨기기</span></div>
    <div class="tp-feat"><span class="tp-ico">📚</span><span data-i18n="p_feat_library">다시보기 라이브러리</span></div>
  </div>

  <div class="tp-lang">
    <label for="langsel">🌐 <span data-i18n="p_language">언어</span></label>
    <select id="langsel">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
    </select>
  </div>

  <div class="tp-btns">
    <button id="openYt" class="tp-primary" data-i18n="p_open_youtube">유튜브 열기</button>
    <button id="openGh" class="tp-ghost">GitHub</button>
  </div>

  <p class="tp-hint" data-i18n="p_hint"></p>

  <script src="tp-i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
